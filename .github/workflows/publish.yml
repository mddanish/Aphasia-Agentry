name: release-artifacts
# On a published GitHub Release, build the wheel + sdist and attach them to the
# release as downloadable assets (GitHub-hosted package files). PyPI publishing
# is done separately (see README); to enable Trusted Publishing later, add a
# pypa/gh-action-pypi-publish step with id-token: write.
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: cd engine && uv build
      - uses: softprops/action-gh-release@v2
        with:
          files: engine/dist/*
