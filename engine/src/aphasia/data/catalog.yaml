# Aphasia technique catalog — merged, deduplicated adversarial taxonomy for testing AI AGENTS.
#
# Scope: only tactics/techniques/procedures that Aphasia can RUN against a live agent or its
# MCP toolchain (direct black box, or proxy mode). Pure training/supply-chain/infra/human-process
# items from the sources are listed under tactic "context" with testable: none (reference only,
# not run) so the taxonomy stays complete without pretending to test what Aphasia cannot.
#
# Sources (credit required by their licenses — see docs/CREDITS.md):
#   aatmf    AATMF v3 (Kai Aizen / SnailSploit)        CC BY-SA 4.0   T<tac>-AT-<nnn>
#   arcanum  Arcanum Prompt Injection Taxonomy (Haddix) CC BY 4.0     technique/evasion/intent id
#   zeroleaks ZeroLeaks scanner categories (Arcanum-Sec? ZeroLeaks)   FSL-1.1-Apache-2.0  category
# Each entry is one UNIQUE technique; `sources` lists every taxonomy that named the same thing.
#
# Fields:
#   id            stable Aphasia id (AP-T##); never reused
#   name          short label
#   category      scan group (see `categories` below); pick with `aphasia run --category <id>`
#   tactic        OWASP-LLM-aligned coarse bucket
#   owasp/atlas   framework mapping (indicative; verify against current versions)
#   scenario      existing Aphasia scenario that already exercises it, or "" if new/uncovered
#   channel       delivery: direct | email | doc | ticket | mcp | rag | multimodal | any
#   testable      direct | proxy | both | none   (none = reference only, not executable here)
#   proxy_better  true when proxy mode sees far more (context in, tool defs, tool calls) than black box
#   sources       {aatmf, arcanum, zeroleaks} ids that map to this technique

