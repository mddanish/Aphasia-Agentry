# Generated by `aphasia proxy start` into runs/proxy/config.yaml. Template for reference.
# Run in its own env:  uvx --from "litellm[proxy]==1.111.0" litellm --config runs/proxy/config.yaml --host 127.0.0.1 --port 4000
# Secrets are env references only. Never write keys into this file.
model_list:
  - model_name: agent-model                      # what the agent asks for (--alias)
    litellm_params:                              # = [upstream] in config.toml (NOT [attacker])
      model: ollama_chat/qwen2.5:7b-instruct          # real provider/model (--provider-model)
      api_base: http://127.0.0.1:11434           # [upstream].api_base, only for local / self-hosted providers
      api_key: os.environ/APHASIA_UPSTREAM_API_KEY   # UPSTREAM key only; never the attacker key

litellm_settings:
  callbacks: aphasia_recorder.recorder           # aphasia_recorder.py sits next to this file
  drop_params: true

general_settings:
  master_key: os.environ/APHASIA_PROXY_KEY       # the key the agent uses

# Recorder env (set by `aphasia proxy start`):
#   APHASIA_PROXY_LOG=runs/proxy/proxy.jsonl
#   APHASIA_RUN_CONTEXT=runs/proxy/context.json
#   APHASIA_PROXY_FULL=1   (optional: no 2000-char clipping)
